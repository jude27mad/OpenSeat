<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 508" width="960" height="508" role="img" aria-labelledby="title description">
  <title id="title">Walk and drive</title>
  <desc id="description">Two views of the same cities at night. A man walks the upper road while a car drives the lower road and arrives first.</desc>
  <style>
    :root {background:#101320}
    .walker-trip {animation: walk-trip 16s linear infinite}
    .car-trip {animation: car-trip 16s linear infinite}
    .wheel-spokes {animation: turn 16s linear infinite; transform-origin: 0 0}
    .traveller {animation: reset 16s linear infinite}
    .striding {animation: stride-show 16s linear infinite}
    .standing {animation: rest-show 16s linear infinite}
    .paused * {animation-play-state: paused !important}
    @keyframes walk-trip {
      0%,3.125% {transform:translateX(0)}
      90.625%,100% {transform:translateX(570px)}
    }
    @keyframes car-trip {
      0%,3.125% {transform:translateX(0); animation-timing-function:cubic-bezier(.24,.04,.34,1)}
      40.625%,100% {transform:translateX(570px)}
    }
    @keyframes turn {
      0%,3.125% {transform:rotate(0deg); animation-timing-function:cubic-bezier(.24,.04,.34,1)}
      40.625%,100% {transform:rotate(3266deg)}
    }
    @keyframes reset {0% {opacity:0} 2%,96% {opacity:1} 99%,100% {opacity:0}}
    @keyframes stride-show {0%,2.9%,91.1%,100% {opacity:0} 3.6%,90.3% {opacity:1}}
    @keyframes rest-show {0%,2.9%,91.1%,100% {opacity:1} 3.6%,90.3% {opacity:0}}
    @media (prefers-reduced-motion: reduce) {
      .walker-trip, .car-trip, .wheel-spokes, .traveller, .striding, .standing {animation:none}
      .walker-trip {transform:translateX(194px)}
      .car-trip {transform:translateX(433px)}
      .striding {display:none}
      .standing {opacity:1}
    }
  </style>
  <defs>
    <linearGradient id="sky" x2=".82" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#10192a"/><stop offset=".48" stop-color="#171b32"/><stop offset="1" stop-color="#3c3241"/>
    </linearGradient>
    <radialGradient id="haze" cx=".67" cy="1" r=".77" gradientTransform="translate(0 .36) scale(1 .64)">
      <stop stop-color="#c68470" stop-opacity=".47"/><stop offset=".52" stop-color="#a37e87" stop-opacity=".17"/><stop offset="1" stop-color="#8398b5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="city" x2=".3" y2="1"><stop stop-color="#20283c"/><stop offset=".68" stop-color="#192337"/><stop offset="1" stop-color="#111d2e"/></linearGradient>
    <linearGradient id="outline" x2=".4" y2="1"><stop stop-color="#ffefcf"/><stop offset=".65" stop-color="#dfc9ac"/><stop offset="1" stop-color="#9b9aa2"/></linearGradient>
    <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#182335"/><stop offset="1" stop-color="#0f1725"/></linearGradient>
    <linearGradient id="glass" x2=".7" y2="1"><stop stop-color="#59647a"/><stop offset=".82" stop-color="#283449"/></linearGradient>
    <linearGradient id="headlight" x2="1" y2=".5"><stop stop-color="#e1e9fb" stop-opacity=".52"/><stop offset=".64" stop-color="#cbdcfa" stop-opacity=".14"/><stop offset="1" stop-color="#cbdcfa" stop-opacity="0"/></linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="0" x2="960" y1="208" y2="208"><stop stop-color="#9f9392"/><stop offset=".23" stop-color="#f1d4a4"/><stop offset=".72" stop-color="#ffecc3"/><stop offset="1" stop-color="#a69ba1"/></linearGradient>
    <filter id="soft-glow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur"/><feFlood flood-color="#ffe0ab" flood-opacity=".24"/><feComposite in2="blur" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="beacon"><stop stop-color="#ffc7a0" stop-opacity=".85"/><stop offset=".4" stop-color="#ff9379" stop-opacity=".27"/><stop offset="1" stop-color="#f57e7f" stop-opacity="0"/></radialGradient>
    <clipPath id="panel"><rect width="960" height="244" rx="11"/></clipPath>
