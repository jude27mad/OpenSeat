name: Build and publish OpenSeat
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build the emulator-backed test site
        run: npm run build
        env:
          VITE_OPENSEAT_EMULATORS: '1'
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify database rules and two-device updates
        env:
          VITE_OPENSEAT_EMULATORS: '1'
        run: ./node_modules/.bin/firebase emulators:exec --project demo-openseat --only auth,database 'node --test tests/firebase/*.test.js && npm run test:ui'
      - name: Build the production site with its registered Firebase web app
        if: github.ref == 'refs/heads/main'
        env:
          VITE_OPENSEAT_FIREBASE_CONFIG: ${{ vars.OPENSEAT_FIREBASE_CONFIG }}
        run: npm run build
      - name: Save browser test evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prototype-browser-evidence
          path: test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: production-site
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
    permissions:
      contents: write
      pages: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: production-site
          path: build
      - name: Publish the tested files to the Pages source branch
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd site
          main_head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$main_head" != "$GITHUB_SHA" ]; then
            echo 'A newer main commit owns the next release.'
            exit 0
          fi
          rsync -a --delete --exclude='/.git/' --exclude='/.github/' --exclude='/CNAME' ../build/ ./
          touch .nojekyll
          git add --all
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish OpenSeat $GITHUB_SHA"
            git push origin HEAD:gh-pages
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
          echo 'published=true' >> "$GITHUB_OUTPUT"
  verify-live:
    needs: deploy
    if: needs.deploy.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENSEAT_TEST_URL: https://jude27mad.github.io/OpenSeat/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - uses: actions/download-artifact@v4
        with:
          name: production-site
          path: build
      - name: Wait for this build to reach the public map
        run: |
          set -euo pipefail
          entry=$(grep -oE 'src="\./assets/[^"]+\.js"' build/index.html | head -n 1)
          for attempt in {1..36}; do
            if curl -fsSL --max-time 10 "${OPENSEAT_TEST_URL}?release=${GITHUB_SHA}&attempt=${attempt}" -o "$RUNNER_TEMP/openseat.html" && grep -Fq "$entry" "$RUNNER_TEMP/openseat.html"; then
              exit 0
            fi
            sleep 5
          done
          echo 'GitHub Pages has not served this build yet.' >&2
          exit 1
      - name: Verify the published map, QR sharing and evidence
        run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-browser-evidence
          path: test-results/
          retention-days: 14
