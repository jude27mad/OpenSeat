name: Approve an OpenSeat admin browser
on:
  workflow_dispatch:
    inputs:
      device:
        description: Browser ID copied from the OpenSeat admin page
        required: true
        type: string
      action:
        description: Browser access
        required: true
        type: choice
        options:
          - Approve
          - Revoke
permissions:
  contents: read
jobs:
  manage:
    if: github.actor_id == github.repository_owner_id && github.triggering_actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update access for this browser
        env:
          DEVICE_ID: ${{ inputs.device }}
          DEVICE_ACTION: ${{ inputs.action }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          OPENSEAT_FIREBASE_CONFIG: ${{ vars.OPENSEAT_FIREBASE_CONFIG }}
        run: node backend/firebase/admin-device.mjs
