<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f5">
    <script>
      let appearance
      try { appearance = localStorage.getItem('openseat.theme') } catch {}
      const dark = appearance === 'dark' ||
        (appearance !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'
    </script>
    <title>Prototype evidence · OpenSeat</title>
    <meta name="description" content="OpenSeat’s Milestone 5 record for TMU’s Student Learning Centre. Compare the floor maps, inspect the Bluetooth scanner logs, and see what the $0 prototype has been tested against.">
    <link rel="canonical" href="https://jude27mad.github.io/OpenSeat/evidence/">
    <link rel="icon" href="../mark.svg?v=cutout-2" type="image/svg+xml">
    <link rel="stylesheet" href="./record.css">
  </head>
  <body>
    <div id="root"></div>
    <template id="site-content">
      <header>
        <a class="brand" href="../"><img src="../mark.svg?v=cutout-2" width="30" height="30" alt="">OpenSeat</a>
        <a href="../">Open the map</a>
      </header>
      <main>
        <!-- evidence-overview -->
        <nav aria-label="Evidence sections">
          <a href="#process-evidence">Map revisions</a>
          <a href="#calibration-already-completed">Bluetooth readings</a>
          <a href="#connecting-the-scanner">Scanner logs</a>
          <a href="#verification">Test results</a>
          <a href="#build-plan-and-materials">Build plan</a>
          <a href="./milestone-5.pdf" type="application/pdf">Milestone 5 PDF</a>
        </nav>
        <!-- prototype-evidence -->
      </main>
    </template>
    <script type="module">
      import { applyTheme } from '../src/theme.js'
      import { renderStaticSite } from '../src/SiteAccess.jsx'
      applyTheme()
      renderStaticSite((record) => {
        for (const img of record.querySelectorAll('figure img')) {
          const link = document.createElement('a')
          link.href = img.src
          link.setAttribute('aria-label', 'View full size. ' + img.alt)
          img.replaceWith(link)
          link.append(img)
        }
      })
    </script>
  </body>
</html>
