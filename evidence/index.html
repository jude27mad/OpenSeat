        <h1>OpenSeat · CEN100 prototype record</h1>
<p>Milestone 5 · Section 29, Group 9 · November 25, 2026</p>
<p>OpenSeat maps <strong>626 open-study seats</strong> in TMU’s Student Learning Centre (SLC). In the demo, a student can open a reported free seat in under 10 seconds. The <a href="#materials-and-cost">total extra cost was <strong>$0</strong></a>.</p>

        <section id="concept-and-scope"><h2>Concept and scope</h2>
<p>We wanted students to know where to study before walking there. Our first idea relied on student reports. Once someone found a seat, they had little reason to keep updating the map. That led us to try Bluetooth counting and to design sensors for individual chairs.</p>
<p>Students can report a seat directly or scan its QR code to open it. Each seat shows the source and age of its status. A fresh seat-sensor reading takes priority over a student report. On the live map, a seat returns to <strong>No recent info</strong> once its readings expire. Bluetooth supplies an area count. The classroom demo used an iPhone and an iPad, with simulated seat sensors.</p>
</section>
<section id="process-evidence"><h2>Map revisions and prototype screenshots</h2>
<p>We built Floor 8 first, connected the reports, QR check-ins and simulated readings, then traced Floors 5 and 7 from their own SLC booking maps. The prototype screenshots below were captured on November 22. Select any image to open it at full size.</p>

<p>The first trace had 90 individual seats. Checking the drawing again revealed two more. The corrected map has 92 individual seats and 40 four-chair tables, for <strong>252 seats</strong>. The 20 bookable rooms are shown separately.</p>

<section id="calibration-already-completed"><h2>Bluetooth calibration</h2>
<p>A scan in a room with about <strong>20 people</strong> detected <strong>over 150 devices</strong>. To see how signal strength varied, we recorded five readings from the same device in the library. We set an inclusive <strong>−75 dBm</strong> cutoff. Two of the five readings met it. Each device counts once per scan.</p>

<section id="connecting-the-scanner"><h2>Connecting the scanner</h2>
<p>BLE2MQTT sent scan batches from the iPhone to the flespi MQTT broker. The scanner had permission to publish, and a separate subscriber could read the messages. A ChatGPT Sites relay passed the count to the classroom page.</p>

<section id="attribution"><h2>Attribution</h2>
<p><strong>Student contribution — Jude Ahmad</strong></p>
<p>I led the development of the OpenSeat prototype, from exploring automatic sensing to directing the design, functionality and appearance of the website.</p>
<p>My work included Bluetooth experiments and calibration, investigating TMU&#39;s existing network infrastructure, mapping 626 study seats across three floors, setting up MQTT communication and working through the transition from Floot to Firebase.</p>
<p>I also worked on how the system handles conflicting reports, outdated information, sensor priority, misuse prevention, QR codes and seat recommendations. I directed the mobile and desktop layouts, navigation, administrative controls and OpenSeat&#39;s visual identity.</p>
<p>Throughout development, I tested the prototype, identified problems, directed corrections, evaluated its limitations and documented the results. AI-assisted tools were used to implement the software based on these decisions.</p>
<p><strong>AI-assisted development</strong> implemented the React prototype, shared service, QR codes, simulator and tests from those design decisions, and produced this build record and screenshots.</p>
<p>The team notebook is the source for the remaining group members’ contributions. Those entries were pending when the November 25 record was prepared.</p>
